%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/ti,lm36273.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TI LM36273 backlight and LCD bias controller

maintainers:
  - devicetree@vger.kernel.org

description: |
  The LM36273 controls an LCD backlight and provides positive and negative
  bias rails. The bias output is represented by a regulator subnode.

properties:
  compatible:
    oneOf:
      - const: ti,lm36273
      - items:
          - const: mediatek,i2c_lcd_bias
          - const: ti,lm36273

  reg:
    maxItems: 1

  bias:
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - bias

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        backlight@11 {
            compatible = "ti,lm36273";
            reg = <0x11>;

            bias {
                regulator-name = "panel-bias";
                regulator-min-microvolt = <5500000>;
                regulator-max-microvolt = <5500000>;
            };
        };
    };
