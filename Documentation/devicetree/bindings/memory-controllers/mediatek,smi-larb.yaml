%YAML 1.2
---
$id: http://devicetree.org/schemas/memory-controllers/mediatek,smi-larb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SMI (Smart Multimedia Interface) Local Arbiter

maintainers:
  - Yong Wu <yong.wu@mediatek.com>

description: |
  The hardware block diagram please check bindings/iommu/mediatek,iommu.yaml

properties:
  compatible:
    oneOf:
      - enum:
          - mediatek,mt2701-smi-larb
          - mediatek,mt2712-smi-larb
          - mediatek,mt6779-smi-larb
          - mediatek,mt6795-smi-larb
          - mediatek,mt6853-smi-larb
          - mediatek,mt6893-smi-larb
          - mediatek,mt8167-smi-larb
          - mediatek,mt8173-smi-larb
          - mediatek,mt8183-smi-larb
          - mediatek,mt8186-smi-larb
          - mediatek,mt8188-smi-larb
          - mediatek,mt8192-smi-larb
          - mediatek,mt8195-smi-larb

      - description: for mt7623
        items:
          - const: mediatek,mt7623-smi-larb
          - const: mediatek,mt2701-smi-larb

      - items:
          - const: mediatek,mt8365-smi-larb
          - const: mediatek,mt8186-smi-larb

  reg:
    maxItems: 1

  clocks:
    description: |
      apb and smi are mandatory. gals(global async local sync) is optional.
    minItems: 2
    items:
      - description: apb is Advanced Peripheral Bus clock, It's the clock for
          setting the register.
      - description: smi is the clock for transfer data and command.
      - description: the path0 clock for gals.
      - description: the path1 clock for gals.

  clock-names:
    minItems: 2
    maxItems: 4

  power-domains:
    maxItems: 1

  mediatek,smi:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: |
      A phandle to the SMI common or sub-common for this LARB. The ACK 6.18
      IOMMU parser follows mediatek,smi parent links only while the referenced
      node has the mediatek,smi-sub-common compatible, stopping at the
      unmarked root common. Traversal must be bounded and reject cycles or a
      marked node without a parent; every LARB in one M4U's larbs list must
      resolve to the same root. This schema cannot validate phandle targets
      or those cross-node constraints; the board DT must satisfy them.

  mediatek,larb-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 31
    description: |
      The hardware ID of this LARB. It is required for MT6853 so the IOMMU
      component bind assigns the ID used to index the SMI tuning table.
      Other SoCs only need it when the ID is not consecutive from the M4U's
      point of view.

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - power-domains

allOf:
  - if:  # HW has gals
      properties:
        compatible:
          enum:
            - mediatek,mt8183-smi-larb
            - mediatek,mt8186-smi-larb
            - mediatek,mt8188-smi-larb
            - mediatek,mt8195-smi-larb

    then:
      properties:
        clocks:
          minItems: 2
          maxItems: 3
        clock-names:
          minItems: 2
          items:
            - const: apb
            - const: smi
            - const: gals
          additionalItems: false

    else:
      if:
        properties:
          compatible:
            contains:
              const: mediatek,mt6853-smi-larb
      then:
        required:
          - mediatek,smi
          - mediatek,larb-id
        properties:
          mediatek,larb-id:
            maximum: 20
          clocks:
            oneOf:
              - minItems: 2
                maxItems: 2
              - minItems: 4
                maxItems: 4
          clock-names:
            oneOf:
              - items:
                  - const: apb
                  - const: smi
                additionalItems: false
              - items:
                  - const: apb
                  - const: smi
                  - const: gals0
                  - const: gals1
                additionalItems: false
      else:
        properties:
          clocks:
            minItems: 2
            maxItems: 2
          clock-names:
            items:
              - const: apb
              - const: smi

  - if:
      properties:
        compatible:
          contains:
            enum:
              - mediatek,mt2701-smi-larb
              - mediatek,mt2712-smi-larb
              - mediatek,mt6779-smi-larb
              - mediatek,mt8186-smi-larb
              - mediatek,mt8188-smi-larb
              - mediatek,mt8192-smi-larb
              - mediatek,mt8195-smi-larb
              - mediatek,mt6853-smi-larb

    then:
      required:
        - mediatek,larb-id

additionalProperties: false

examples:
  - |+
    #include <dt-bindings/clock/mt8173-clk.h>
    #include <dt-bindings/power/mt8173-power.h>

    larb1: larb@16010000 {
      compatible = "mediatek,mt8173-smi-larb";
      reg = <0x16010000 0x1000>;
      mediatek,smi = <&smi_common>;
      power-domains = <&scpsys MT8173_POWER_DOMAIN_VDEC>;
      clocks = <&vdecsys CLK_VDEC_CKEN>,
               <&vdecsys CLK_VDEC_LARB_CKEN>;
      clock-names = "apb", "smi";
    };
